name: Bug report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Fedora 41, macOS 15, Ubuntu 24.04
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.7
    validations:
      required: false
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it?
      options:
        - Native (uv)
        - Docker
        - Other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste relevant logs or tracebacks (they will be formatted as code).
      render: shell
    validations:
      required: false
